# Haibane RenmeiOS — default wallpaper (pre Shadow Shell).
# Modern hyprpaper syntax (block form). System-wide copy of the Rakka
# close-up; ~/Pictures/Wallpapers/ also holds per-user copies.
splash = false

wallpaper {
    monitor =
    path = /usr/share/haibane-renmei-os/wallpapers/rakka-halo.jpg
}
