# Haibane RenmeiOS — default Hyprland config for brand-new users.
# Minimal on purpose: once you run `haibane-setup`, Shadow Shell installs
# the full Material 3 configuration and backs this file up.
monitor = , preferred, auto, 1

exec-once = hyprpaper

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = XDG_CURRENT_DESKTOP, Hyprland

$mod = SUPER

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(9ad6ceff) rgba(e8c87aff) 45deg
    col.inactive_border = rgba(2a3138aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, wind
    animation = fade, 1, 5, wind
}

decoration {
    shadow {
        enabled = true
        range = 18
        render_power = 2
        color = rgba(00000088)
    }
}

bind = $mod, Q, exec, kitty
bind = $mod, R, exec, kitty fish -c fuzzel || wofi || kitty
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, SHIFT, 1, movetoworkspace, 1
bind = $mod, SHIFT, 2, movetoworkspace, 2
bind = $mod, SHIFT, 3, movetoworkspace, 3
bind = $mod, SHIFT, 4, movetoworkspace, 4
bind = $mod, SHIFT, 5, movetoworkspace, 5

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
